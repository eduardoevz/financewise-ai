<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">FinanceWise AI: de tus cuentas a decisiones informadas</title>
  <desc id="desc">Portada con un gráfico de barras y una línea ascendente, ambos ilustrativos, y las funciones de análisis, catálogo y exportación.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#123e50"/></linearGradient>
    <linearGradient id="bar" x2="0" y2="1"><stop stop-color="#55edc2"/><stop offset="1" stop-color="#168d98"/></linearGradient>
    <linearGradient id="area" x2="0" y2="1"><stop stop-color="#60e7dd" stop-opacity=".24"/><stop offset="1" stop-color="#60e7dd" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1280" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1180" cy="45" r="250" fill="#46d8b2" opacity=".06"/>
  <circle cx="640" cy="550" r="300" fill="#56a5ed" opacity=".05"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="62" y="55" width="46" height="46" rx="14" fill="#57eac0"/>
    <path d="M75 87V72h7v15m5 0V64h7v23" fill="none" stroke="#09293a" stroke-width="4"/>
    <text x="122" y="87" font-size="24" font-weight="700" fill="#e9f7ff">FinanceWise <tspan fill="#66edc8">AI</tspan></text>
    <text x="62" y="176" font-size="49" font-weight="700" fill="#fff">Tus cuentas.</text>
    <text x="62" y="235" font-size="49" font-weight="700" fill="#66edc8">Una visión más clara.</text>
    <text x="64" y="282" font-size="20" fill="#bbd0df">Organiza, compara y comprende tus datos</text>
    <text x="64" y="312" font-size="20" fill="#bbd0df">financieros con indicadores y asistencia de IA.</text>
    <g font-size="14" font-weight="600" fill="#daf7f0">
      <rect x="62" y="355" width="151" height="38" rx="19" fill="#1b4856"/><text x="83" y="379">NIO · USD · EUR</text>
      <rect x="224" y="355" width="132" height="38" rx="19" fill="#1b4856"/><text x="245" y="379">PDF + Excel</text>
      <rect x="367" y="355" width="162" height="38" rx="19" fill="#1b4856"/><text x="388" y="379">Catálogo personal</text>
    </g>
    <text x="64" y="458" font-size="15" fill="#8eabba">NEXT.JS  /  FIREBASE  /  GEMINI</text>
    <rect x="688" y="70" width="530" height="372" rx="22" fill="#0d2034" stroke="#2b4e60"/>
    <text x="720" y="111" font-size="17" font-weight="600" fill="#edf8ff">De los datos a la perspectiva</text>
    <text x="720" y="139" font-size="13" fill="#93afbf">Visualización ilustrativa · no representa resultados reales</text>
    <g stroke="#284251" stroke-dasharray="4 6"><path d="M726 205H1180M726 265H1180M726 325H1180"/></g>
    <g fill="url(#bar)"><rect x="745" y="289" width="39" height="69" rx="6"/><rect x="816" y="254" width="39" height="104" rx="6"/><rect x="887" y="273" width="39" height="85" rx="6"/><rect x="958" y="225" width="39" height="133" rx="6"/><rect x="1029" y="206" width="39" height="152" rx="6"/><rect x="1100" y="171" width="39" height="187" rx="6"/></g>
    <path d="M744 268L815 235L886 248L957 202L1028 180L1138 155V359H744Z" fill="url(#area)"/>
    <path d="M744 268L815 235L886 248L957 202L1028 180L1138 155" fill="none" stroke="#a5f8dc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#d3fff0"><circle cx="744" cy="268" r="4"/><circle cx="886" cy="248" r="4"/><circle cx="1028" cy="180" r="4"/><circle cx="1138" cy="155" r="5"/></g>
    <path d="M721 378H1183" stroke="#294c5c"/>
    <text x="723" y="408" font-size="14" fill="#b8cedd">Captura</text><text x="869" y="408" font-size="14" fill="#b8cedd">Análisis</text><text x="1031" y="408" font-size="14" fill="#b8cedd">Exportación</text>
  </g>
</svg>
